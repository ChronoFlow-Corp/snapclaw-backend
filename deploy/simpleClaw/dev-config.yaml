environment: development

http:
  addr: ":1337"
  origins: [ "http://localhost", "http://localhost:3000" ]

database:
  dsn: "postgresql://simpleclaw:simpleclaw@simpleclaw-db:5432/simpleclaw?sslmode=disable"

auth:
  google:
    callback_url: "http://localhost:1337/api/auth/connect/google/callback"
    client_id: "REPLACE_ME"
    frontend_url: "localhost:3000"
    client_secret: "REPLACE_ME"
  jwt:
    refresh_secret: "REPLACE_ME"
    access_secret_public: /config/keys/jwtRS256.key.pub
    access_secret_private: /config/keys/jwtRS256.key
    access_expire: 24h
    refresh_expire: 168h

hosting:
  container_manager:
    timeout: 15s
    backup_path: "/data/simpleclaw/backups"

openrouter:
  base_url: "https://openrouter.ai"
  api_token: "REPLACE_ME"
  timeout: 15s

connect:
  gmail:
    client_id: "REPLACE_ME"
    client_secret: "REPLACE_ME"
    callback_url: "http://localhost:1337/api/me/connect/gmail/callback"
    watch:
      topic: "projects/REPLACE_ME/topics/gog-gmail-watch"
      labels: [ "INBOX" ]

observability:
  metrics:
    enabled: true
    path: "/metrics"
  tracing:
    enabled: true
    endpoint: "http://tempo:4318"
    insecure: true
    sample_ratio: 1
